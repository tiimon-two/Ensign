<header class="header">
    <div class="container">
        <div class="header__top">
            <ul class="media">
                <li class="media__item">
                    <a class="media__link" href="/radio">
                        <span class="media__icon" aria-hidden="true">
                            <img src="/src/assets/play.svg" alt="">
                        </span>
                        <span class="media__label">Радио Парки</span>
                    </a>
                </li>
                <li class="media__item">
                    <a class="media__link" href="/podcasts">
                        <span class="media__icon" aria-hidden="true">
                            <img src="/src/assets/play.svg" alt="">
                        </span>
                        <span class="media__label">Подкасты</span>
                    </a>
                </li>
            </ul>
            <div class="header__tools">
                <button class="header__tool-button" type="button">
                    <span class="header__tool-icon header__tool-icon--search" aria-hidden="true">
                        <img src="img/color-3.svg" alt="">
                    </span>
                    <span class="header__tool-label">Поиск по сайту</span>
                </button>
                <button class="header__tool-button" type="button">
                    <span class="header__tool-icon header__tool-icon--accessibility" aria-hidden="true">
                        <img src="img/color-4.svg" alt="">
                    </span>
                    <span class="header__tool-label">Версия для слабовидящих</span>
                </button>
            </div>
        </div>
        <div class="header__divider" aria-hidden="true">
            <img class="header__divider-line" src="img/line-1.svg" alt="">
        </div>
        <nav class="header__nav" aria-label="Основная навигация">
            <a class="header__logo" href="/" aria-label="Парки Москвы">
                <img class="header__logo-image" src="img/layer-1.svg" alt="Парки Москвы">
            </a>
            <ul class="header__menu">
                <li class="header__menu-item">
                    <a class="header__menu-link" href="#">
                        <span class="header__menu-label">Об организации</span>
                    </a>
                </li>
                <li class="header__menu-item">
                    <a class="header__menu-link" href="#">
                        <span class="header__menu-label">Афиша</span>
                    </a>
                </li>
                <li class="header__menu-item">
                    <a class="header__menu-link" href="#">
                        <span class="header__menu-label">Медиа</span>
                    </a>
                </li>
                <li class="header__menu-item">
                    <a class="header__menu-link" href="#">
                        <span class="header__menu-label">Стать партнером</span>
                    </a>
                </li>
                <li class="header__menu-item">
                    <a class="header__menu-link" href="#">
                        <span class="header__menu-label">Открой бизнес</span>
                    </a>
                </li>
                <li class="header__menu-item">
                    <a class="header__menu-link header__menu-link--accent" href="#">
                        <span class="header__menu-label">К любимому парку</span>
                        <span class="header__menu-icon" aria-hidden="true">
                            <img src="img/color-2.svg" alt="">
                        </span>
                    </a>
                </li>
                <li class="header__menu-item">
                    <a class="header__menu-link" href="#">
                        <span class="header__menu-label">Инфраструктура</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>
